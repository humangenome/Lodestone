name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches a hosting link that rots between releases. The 404 class this
    # guards against reached ~89 published release pages across the sibling
    # products before anyone checked one.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint every release-notes file
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(.github/release-notes/v*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no release-notes files yet — nothing to lint"
            exit 0
          fi
          for f in "${files[@]}"; do
            tag=$(basename "$f" .md)
            echo "::group::${tag}"
            tools/ci/lint-release-notes.sh "$f" "${tag#v}"
            echo "::endgroup::"
          done

      - name: README links resolve
        run: |
          set -uo pipefail
          fail=0
          # Relative targets must exist on disk.
          grep -oE '\]\([^)#][^)]*\)' README.md | tr -d '()]' | while read -r t; do :; done
          for t in $(grep -oE '\]\(([^)]+)\)' README.md | sed -E 's/^\]\(//; s/\)$//'); do
            case "$t" in
              \#*) continue ;;
              http*)
                code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 25 "$t" || echo 000)
                # GitHub returns 404 for a releases/latest with no releases yet.
                if [ "$code" != "200" ] && [ "$code" != "429" ]; then
                  echo "::warning::HTTP $code for $t"
                fi
                ;;
              *)
                target=${t%%#*}
                [ -z "$target" ] && continue
                if [ ! -e "$target" ]; then
                  echo "::error::README links $t but it does not exist in the repo"
                  fail=1
                fi
                ;;
            esac
          done
          exit $fail

      - name: README images exist
        run: |
          set -euo pipefail
          fail=0
          for img in $(grep -oE 'src="[^"]+"' README.md | sed -E 's/^src="//; s/"$//'); do
            case "$img" in
              http*) continue ;;
            esac
            if [ ! -f "$img" ]; then
              echo "::error::README references image $img which is not in the repo"
              fail=1
            else
              echo "OK $img"
            fi
          done
          exit $fail

      - name: Shell scripts parse clean
        run: |
          for f in tools/ci/*.sh; do bash -n "$f"; echo "OK $f"; done
